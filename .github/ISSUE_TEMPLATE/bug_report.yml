name: Bug report
description: Report a reproducible problem in RapidHash
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: RapidHash version
      placeholder: Version, commit, or package identifier
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other or multiple
    validations:
      required: true
  - type: input
    id: system-details
    attributes:
      label: System details
      description: OS version, architecture, installation method, and file system when relevant
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use non-sensitive sample paths and data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Remove private paths, file names, digests, tokens, and personal data.
      render: text
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and tested the newest supported release.
          required: true
        - label: This report does not contain a security vulnerability or sensitive data.
          required: true
