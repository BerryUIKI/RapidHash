[package]
name = "rapidhash-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Command-line interface for RapidHash"

[[bin]]
name = "rapidhash"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fluent-bundle = "0.16"
rapidhash-core = { path = "../rapidhash-core" }
rapidhash-formats = { path = "../rapidhash-formats" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unic-langid = "0.9"
